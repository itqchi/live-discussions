name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm i

      - name: Export generated npm lockfile
        uses: actions/upload-artifact@v7
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Verify workspace
        run: npm run check

      - name: Verify migration runner
        run: npm run migrate:api

      - name: Smoke test compiled API
        env:
          DATABASE_DRIVER: memory
          LIVEKIT_URL: wss://ci.livekit.example
          LIVEKIT_API_KEY: ci-api-key
          LIVEKIT_API_SECRET: ci-api-secret
          PORT: 3100
        run: |
          npm run start:api:production > /tmp/live-discussions-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/live-discussions-api.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3100/rooms > /dev/null
          API_BASE_URL=http://127.0.0.1:3100 node scripts/smoke-api.mjs

      - name: Verify hosted runtime config
        env:
          API_BASE_URL: https://api.example.invalid
        run: node scripts/write-web-runtime-config.mjs

  bootstrap-lockfile:
    name: Bootstrap npm lockfile
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/initial-platform'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download generated npm lockfile
        uses: actions/download-artifact@v8
        with:
          name: generated-package-lock
          path: .

      - name: Commit lockfile when missing or changed
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Commit generated npm lockfile"
          git push origin "HEAD:${HEAD_BRANCH}"
