name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  npm-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Verify npm install
        run: npm install --package-lock=false

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        run: pnpm build:web

      - name: Build API
        run: pnpm build:api
