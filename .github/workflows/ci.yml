name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        run: npm run check

      - name: Verify migration runner
        run: npm run migrate:api

      - name: Smoke test compiled API
        env:
          DATABASE_DRIVER: memory
          LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret
          PORT: 3100
        run: |
          docker run --detach --rm \
            --name live-discussions-livekit \
            --publish 7880:7880 \
            livekit/livekit-server:v1.13.5 \
            --dev --bind 0.0.0.0

          LIVEKIT_READY=0
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/7880) 2>/dev/null; then
              LIVEKIT_READY=1
              break
            fi
            sleep 1
          done

          if [ "$LIVEKIT_READY" -ne 1 ]; then
            docker logs live-discussions-livekit
            exit 1
          fi

          npm run start:api:production > /tmp/live-discussions-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; docker stop live-discussions-livekit > /dev/null 2>&1 || true' EXIT

          READY=0
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/live-discussions-api.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3100/rooms > /dev/null
          API_BASE_URL=http://127.0.0.1:3100 node scripts/smoke-api.mjs
          API_BASE_URL=http://127.0.0.1:3100 node scripts/smoke-room-pins.mjs
          API_BASE_URL=http://127.0.0.1:3100 node scripts/smoke-room-bans.mjs

      - name: Verify hosted runtime config
        env:
          API_BASE_URL: https://api.example.invalid
        run: node scripts/write-web-runtime-config.mjs

  android-native-build:
    name: Android native build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Assemble Android debug app
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
