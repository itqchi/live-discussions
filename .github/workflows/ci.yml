name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm i

      - name: Verify workspace
        run: npm run check

      - name: Verify migration runner
        run: npm run migrate:api

      - name: Verify hosted runtime config
        env:
          API_BASE_URL: https://api.example.invalid
        run: node scripts/write-web-runtime-config.mjs
