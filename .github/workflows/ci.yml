name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        run: npm run check

      - name: Verify migration runner
        run: npm run migrate:api

      - name: Smoke test compiled API
        env:
          DATABASE_DRIVER: memory
          LIVEKIT_URL: wss://ci.livekit.example
          LIVEKIT_API_KEY: ci-api-key
          LIVEKIT_API_SECRET: ci-api-secret
          PORT: 3100
        run: |
          npm run start:api:production > /tmp/live-discussions-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/live-discussions-api.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3100/rooms > /dev/null
          API_BASE_URL=http://127.0.0.1:3100 node scripts/smoke-api.mjs

      - name: Verify hosted runtime config
        env:
          API_BASE_URL: https://api.example.invalid
        run: node scripts/write-web-runtime-config.mjs

  native-host-prototype:
    name: Validate native host scaffold
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate version-matched native hosts
        env:
          NX_DAEMON: "false"
        run: |
          mv apps/mobile /tmp/live-discussions-mobile-source
          set +e
          npx nx generate @nx/react-native:application apps/mobile \
            --displayName="Live Discussions" \
            --unitTestRunner=none \
            --e2eTestRunner=none \
            --linter=none \
            --skipPackageJson \
            --install=false \
            --useProjectJson=true \
            --skipFormat \
            --no-interactive > /tmp/native-generator.log 2>&1
          GENERATOR_STATUS=$?
          set -e
          cat /tmp/native-generator.log

          test -f apps/mobile/android/app/src/main/AndroidManifest.xml
          test -f apps/mobile/android/app/src/main/java/com/mobile/MainApplication.kt
          test -f apps/mobile/android/gradlew
          test -f apps/mobile/ios/Mobile/AppDelegate.swift
          test -f apps/mobile/ios/Mobile/Info.plist
          test -f apps/mobile/ios/Podfile
          test -f apps/mobile/ios/Mobile.xcodeproj/project.pbxproj

          if [ "$GENERATOR_STATUS" -ne 0 ] && ! grep -q "npm error code ERESOLVE" /tmp/native-generator.log; then
            echo "Native generator failed before the known post-scaffold dependency resolution step."
            exit "$GENERATOR_STATUS"
          fi

          mkdir generated-mobile-native-hosts
          cp -R apps/mobile/ios generated-mobile-native-hosts/ios
          cp -R apps/mobile/android generated-mobile-native-hosts/android
          rm -rf apps/mobile
          mv /tmp/live-discussions-mobile-source apps/mobile

      - name: Export native host scaffold
        uses: actions/upload-artifact@v7
        with:
          name: generated-mobile-native-hosts
          path: generated-mobile-native-hosts
          if-no-files-found: error
          retention-days: 1

  commit-native-hosts:
    name: Commit validated native hosts
    needs: native-host-prototype
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/initial-platform'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact tested PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download validated native hosts
        uses: actions/download-artifact@v8
        with:
          name: generated-mobile-native-hosts
          path: generated-mobile-native-hosts

      - name: Commit native host projects
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -rf apps/mobile/ios apps/mobile/android
          cp -R generated-mobile-native-hosts/ios apps/mobile/ios
          cp -R generated-mobile-native-hosts/android apps/mobile/android
          chmod +x apps/mobile/android/gradlew

          if [ -z "$(git status --porcelain -- apps/mobile/ios apps/mobile/android)" ]; then
            echo "Native host projects are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/ios apps/mobile/android
          git commit -m "Add React Native iOS and Android hosts"
          git push origin "HEAD:${HEAD_BRANCH}"
